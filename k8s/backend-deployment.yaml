apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-backend
  labels:
    app: travel-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: travel-backend
  template:
    metadata:
      labels:
        app: travel-backend
    spec:
      containers:
      - name: travel-backend
        image: gaurav1202/travel-backend:latest
        ports:
        - containerPort: 8081
        env:
        - name: JAVA_OPTS
          value: "-Xmx512m -Xms256m"  
